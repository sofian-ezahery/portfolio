<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Geist','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#12151c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Blueprint corner marks -->
  <g stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M64 96 h34 M64 96 v34"/>
    <path d="M1136 96 h-34 M1136 96 v34"/>
    <path d="M64 534 h34 M64 534 v-34"/>
    <path d="M1136 534 h-34 M1136 534 v-34"/>
  </g>

  <!-- Top label -->
  <text x="96" y="150" fill="#3b82f6" font-size="20" font-weight="700" letter-spacing="6" font-family="'Geist Mono',ui-monospace,monospace">PORTFOLIO // DEVOPS</text>

  <!-- Name -->
  <text x="94" y="288" fill="#f5f7fa" font-size="96" font-weight="800" letter-spacing="-2">Sofian Ez-ahery</text>

  <!-- Title -->
  <text x="96" y="360" fill="#9aa4b2" font-size="40" font-weight="500">Ingénieur DevOps / SRE</text>

  <!-- Accent divider -->
  <rect x="96" y="404" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Tech tags -->
  <g font-family="'Geist Mono',ui-monospace,monospace" font-size="22" font-weight="600">
    <g>
      <rect x="96" y="452" width="150" height="52" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="171" y="486" fill="#cdd5e0" text-anchor="middle">Docker</text>
    </g>
    <g>
      <rect x="262" y="452" width="180" height="52" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="352" y="486" fill="#cdd5e0" text-anchor="middle">Kubernetes</text>
    </g>
    <g>
      <rect x="458" y="452" width="168" height="52" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="542" y="486" fill="#cdd5e0" text-anchor="middle">Terraform</text>
    </g>
    <g>
      <rect x="642" y="452" width="120" height="52" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="702" y="486" fill="#cdd5e0" text-anchor="middle">CI/CD</text>
    </g>
    <g>
      <rect x="778" y="452" width="110" height="52" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="833" y="486" fill="#cdd5e0" text-anchor="middle">AWS</text>
    </g>
  </g>

  <!-- Domain / handle bottom right -->
  <text x="1136" y="558" fill="#5b6675" font-size="22" font-weight="500" text-anchor="end" font-family="'Geist Mono',ui-monospace,monospace">github.com/sofian-ezahery</text>
</svg>
